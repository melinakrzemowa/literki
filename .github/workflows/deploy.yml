name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_RELEASE: 4.6.2-stable        # used in download URLs / filenames
  GODOT_TEMPLATE_DIR: 4.6.2.stable   # dot-form, used in the install path
  IMAGE_NAME: ghcr.io/melinakrzemowa/literki
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history + tags for `git describe`

      - name: Compute VERSION
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved VERSION=$VERSION"

      # ---- Godot install (Linux headless + export templates) ----------------

      - name: Cache Godot binary + templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: godot-${{ env.GODOT_RELEASE }}-v1

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_RELEASE }}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${{ env.GODOT_RELEASE }}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_RELEASE }}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          unzip -q -j /tmp/templates.tpz "templates/*" \
            -d ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}

      - name: Import project
        run: ~/godot/godot --headless --import

      # A broken game should not reach the Air.
      - name: Run tests
        run: ~/godot/godot --headless --script tests/run_tests.gd --quit

      - name: Export Web build
        run: |
          set -e
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -s build/web/index.wasm
          ls -lh build/web/

      # ---- Docker build + push to GHCR --------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64/v8
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- SSH + cloudflared deploy -----------------------------------------

      - name: Install cloudflared
        run: |
          curl -sSL -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host airssh.melinakrzemowa.pl
            HostName airssh.melinakrzemowa.pl
            User ${{ secrets.SSH_USERNAME }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy on Air
        env:
          SSH_TARGET: ${{ secrets.SSH_USERNAME }}@airssh.melinakrzemowa.pl
          DEPLOY_DIR: /Users/${{ secrets.SSH_USERNAME }}/services/literki.melinakrzemowa.pl
        run: |
          set -e
          ssh "$SSH_TARGET" "mkdir -p '$DEPLOY_DIR'"
          scp docker-compose.yml "$SSH_TARGET:$DEPLOY_DIR/docker-compose.yml"
          ssh "$SSH_TARGET" "VERSION=$VERSION DEPLOY_DIR=$DEPLOY_DIR bash -s" <<'EOF'
          set -e
          cd "$DEPLOY_DIR"
          docker pull ghcr.io/melinakrzemowa/literki:$VERSION
          VERSION=$VERSION docker compose up -d
          docker image prune -f
          EOF

      - name: Check it answers
        run: |
          sleep 5
          ssh "${{ secrets.SSH_USERNAME }}@airssh.melinakrzemowa.pl" \
            "curl -fsS -o /dev/null -w 'literki responds %{http_code}\n' http://localhost:4012/"
