server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MIME types Godot's web export needs
    types {
        application/wasm         wasm;
        application/octet-stream pck;
        text/javascript          js;
        text/html                html;
        image/png                png;
        image/svg+xml            svg;
        audio/wav                wav;
    }
    default_type application/octet-stream;

    # The wasm is ~36 MB and compresses to a fraction of that. The Dockerfile
    # gzips it once at build time, so nginx hands over the .gz rather than
    # compressing 36 MB again on every cold load.
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Godot's exporter emits index.js / index.wasm / index.pck every time, so
    # the filenames never change between deploys and URL hashing is not an
    # option. Force revalidation instead: nginx serves ETag + Last-Modified, a
    # redeploy returns 200 with new bytes, an unchanged reload returns 304.
    location ~* \.(wasm|pck|js|png|svg|wav|ico)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }
}
